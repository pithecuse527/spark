# Baseline Spark config — vanilla AQE behavior with SHJ forced.
# Used to capture cache miss + end-to-end time before any patch.

# Force ShuffledHashJoin so we measure the path under study.
spark.sql.join.preferSortMergeJoin              false
# Disable BHJ auto-promotion so AQE does not silently flip strategy.
spark.sql.autoBroadcastJoinThreshold            -1
spark.sql.adaptive.autoBroadcastJoinThreshold   -1

# AQE on, but no skew-join interference for now (separate experiment).
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.skewJoin.enabled             false

# AQE post-shuffle target — this is the value we challenge.
spark.sql.adaptive.advisoryPartitionSizeInBytes 64MB

# Force SHJ via hint propagation when the planner is ambiguous.
spark.sql.shuffledHashJoinFactor                1

# Memory: 16-32 node cluster, 1 executor per node, ~8 cores per executor.
spark.executor.cores                            8
spark.executor.memory                           24g
spark.executor.memoryOverhead                   4g
spark.driver.memory                             8g

# Off-heap on. BytesToBytesMap lives here.
spark.memory.offHeap.enabled                    true
spark.memory.offHeap.size                       8g

# Patch flag (no-op on baseline; V1/V2 toggle it).
spark.sql.mascots.cacheAware.enabled            false
spark.sql.mascots.cacheAware.mode               none
