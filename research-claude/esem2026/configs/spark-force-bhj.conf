# Force BroadcastHashJoin where viable.
# Joins whose build side exceeds 2 GB will still fall back; record those as
# BHJ-infeasible.

spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.skewJoin.enabled             false

# Push thresholds high enough that everything in the workload qualifies.
spark.sql.autoBroadcastJoinThreshold            2147483648    # 2 GB
spark.sql.adaptive.autoBroadcastJoinThreshold   2147483648

# Discourage other strategies when both qualify.
spark.sql.join.preferSortMergeJoin              true
spark.sql.shuffledHashJoinFactor                100

spark.executor.cores                            8
spark.executor.memory                           24g
spark.executor.memoryOverhead                   4g
spark.driver.memory                             8g
spark.memory.offHeap.enabled                    true
spark.memory.offHeap.size                       8g
