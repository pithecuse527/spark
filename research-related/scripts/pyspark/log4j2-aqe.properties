# AQE log capture. Keeps Spark's default console logging, and additionally
# routes the two AQE loggers to a dedicated rolling file for offline analysis.
# Point the driver JVM at this file with:
#   -Dlog4j.configurationFile=<this file> -Daqe.log.file=<output path>

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

# --- console (unchanged from Spark's default template) ---
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# --- dedicated AQE rolling file ---
appender.aqe.type = RollingFile
appender.aqe.name = aqeFile
appender.aqe.fileName = ${sys:aqe.log.file:-/tmp/aqe.log}
appender.aqe.filePattern = ${sys:aqe.log.file:-/tmp/aqe.log}.%i.gz
appender.aqe.layout.type = PatternLayout
appender.aqe.layout.pattern = %d{ISO8601} %p %c{1.}: %m%n%ex
appender.aqe.policies.type = Policies
appender.aqe.policies.size.type = SizeBasedTriggeringPolicy
appender.aqe.policies.size.size = 50MB
appender.aqe.strategy.type = DefaultRolloverStrategy
appender.aqe.strategy.max = 10

# Plan changed / Final plan / Re-optimize  (spark.sql.adaptive.logLevel)
logger.aqe.name = org.apache.spark.sql.execution.adaptive.AdaptiveSparkPlanExec
logger.aqe.level = debug
logger.aqe.additivity = false
logger.aqe.appenderRef.aqeFile.ref = aqeFile

# Per-rule/batch plan diffs  (spark.sql.planChangeLog.enabled + .level)
# PlanChangeLogger emits at spark.sql.planChangeLog.level, whose default is TRACE
# (SQLConf PLAN_CHANGE_LOG_LEVEL) -- so this logger MUST be trace or the messages
# fall below threshold and nothing is captured. Also requires the runtime conf
# spark.sql.planChangeLog.enabled=true. This is a firehose (every rule/batch diff);
# leave it disabled unless you need rule-level detail -- AdaptiveSparkPlanExec above
# already gives the "Plan changed" / "Final plan" lines for join-strategy decisions.
logger.planchange.name = org.apache.spark.sql.catalyst.rules.PlanChangeLogger
logger.planchange.level = trace
logger.planchange.additivity = false
logger.planchange.appenderRef.aqeFile.ref = aqeFile
